[project]
name = "local-ai"
version = "0.1.0"
description = "course.fast.ai work and local model experiments"
requires-python = "==3.12.*"
dependencies = [
    "fastai==2.8.12",
    "torch==2.14.1",
    "torchvision",
    "timm",
    "jupyterlab",
    "ipykernel",
    "ipywidgets",
]

# CUDA 13.0 wheels: work on the 3070 Ti and include sm_120 for the 5090.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[tool.uv]
package = false
